# item+ local config template
#
# If item+ starts without an existing config, it creates itemplus.conf from
# this file. Relative paths are resolved relative to itemplus.conf.
# For Linux/systemd installs, use config/linux/systemd/itemplus.conf.example.

# Remove this line after the initial setup is complete.
ITEMPLUS_SETUP_REQUIRED=remove_this_line_after_review

# -----------------------------------------------------------------------------
# Application
# -----------------------------------------------------------------------------

APP_NAME=item+
# APP_VERSION is optional. If omitted, item+ uses the shared VERSION file.
# App domain without http:// or https://, for example: itemplus.example.com
APP_DOMAIN=
# Public base URL used for magic links. Must include http:// or https://.
# Leave empty if APP_DOMAIN should be used automatically.
MAGIC_LINK_BASE_URL=

# JSON array. Use ["*"] for local development or your public URL in production.
CORS_ORIGINS=["*"]

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------

# Listen on all interfaces by default for local packaged runs.
# Use 127.0.0.1 when item+ sits behind nginx, Caddy, or another reverse proxy.
HOST=0.0.0.0
PORT=17117

# Trusted reverse proxies that may send X-Forwarded-* headers.
# Keep empty if item+ is exposed directly.
# TRUSTED_PROXIES=127.0.0.1,::1
# TRUSTED_PROXIES=10.0.0.0/8,192.168.0.0/16
TRUSTED_PROXIES=

# -----------------------------------------------------------------------------
# Storage
# -----------------------------------------------------------------------------

DATABASE_URL=sqlite+aiosqlite:///./data/itemplus.db

# MariaDB / MySQL example:
# DATABASE_URL=mysql+aiomysql://user:password@localhost:3306/itemplus

UPLOAD_DIR=./data/uploads
LOG_DIR=./logs
MAX_UPLOAD_SIZE=157286400

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------

JWT_SECRET=
# If JWT_SECRET is empty, item+ generates one automatically on first start.
JWT_ALGORITHM=HS256
JWT_EXPIRY_DAYS=30

# Required for Apple Sign-In token audience validation.
APPLE_BUNDLE_ID=

# -----------------------------------------------------------------------------
# E-mail / Magic Links
# -----------------------------------------------------------------------------

SMTP_HOST=
SMTP_PORT=465
SMTP_USER=
SMTP_PASSWORD=
SMTP_FROM_EMAIL=
SMTP_FROM_NAME=item+
SMTP_USE_TLS=false
MAGIC_LINK_EXPIRY_MINUTES=15

# -----------------------------------------------------------------------------
# Printer
# -----------------------------------------------------------------------------

PRINTER_HOST=
PRINTER_PORT=9100

# -----------------------------------------------------------------------------
# Diagnostics
# -----------------------------------------------------------------------------

DEBUG=false
DEBUG_HTTP=false
ENABLE_API_DOCS=false
